<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KonXion · DJ Spotlight Generator</title>
<style>
@font-face { font-family:'Josefin Sans'; font-weight:100; src:url('http://localhost:8765/JosefinSans-100.ttf'); }
@font-face { font-family:'Josefin Sans'; font-weight:200; src:url('http://localhost:8765/JosefinSans-200.ttf'); }
@font-face { font-family:'Josefin Sans'; font-weight:300; src:url('http://localhost:8765/JosefinSans-300.ttf'); }
@font-face { font-family:'Cormorant Garamond'; font-weight:300; font-style:normal; src:url('http://localhost:8765/CormorantGaramond-300.ttf'); }
@font-face { font-family:'Cormorant Garamond'; font-weight:300; font-style:italic; src:url('http://localhost:8765/CormorantGaramond-300i.ttf'); }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #080808;
  color: #fff;
  font-family: 'Josefin Sans', sans-serif;
  font-weight: 200;
  display: flex;
  gap: 32px;
  padding: 32px;
  min-height: 100vh;
}

.controls {
  flex: 0 0 260px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  position: sticky;
  top: 32px;
  max-height: calc(100vh - 64px);
  overflow-y: auto;
}

.controls h1 {
  font-size: 11px;
  letter-spacing: 0.38em;
  text-transform: uppercase;
  color: rgba(4,200,10,0.8);
  font-weight: 200;
  border-bottom: 1px solid rgba(4,200,10,0.15);
  padding-bottom: 14px;
}

.section-label {
  font-size: 9px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: rgba(4,200,10,0.45);
  margin-top: 4px;
}

.field { display: flex; flex-direction: column; gap: 5px; }

label.field-label {
  font-size: 9px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.3);
}

input[type="text"], textarea, select {
  background: #0e0e0e;
  border: 1px solid rgba(255,255,255,0.08);
  color: #fff;
  font-family: 'Josefin Sans', sans-serif;
  font-weight: 200;
  font-size: 13px;
  letter-spacing: 0.06em;
  padding: 9px 12px;
  outline: none;
  width: 100%;
  transition: border-color 0.2s;
}
input[type="text"]:focus, textarea:focus, select:focus { border-color: rgba(4,200,10,0.4); }
textarea { resize: vertical; min-height: 100px; line-height: 1.6; }
select option { background: #111; }

.photo-drop {
  display: block;
  background: #0e0e0e;
  border: 1px dashed rgba(4,200,10,0.25);
  padding: 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 10px;
  letter-spacing: 0.3em;
  color: rgba(255,255,255,0.25);
  text-transform: uppercase;
}
.photo-drop:hover, .photo-drop.over {
  border-color: rgba(4,200,10,0.6);
  color: rgba(4,200,10,0.8);
  background: rgba(4,200,10,0.04);
}
.photo-drop input { display: none; }

/* Background option swatches */
.bg-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.bg-swatch {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  cursor: pointer;
}
.bg-swatch canvas {
  width: 112px !important;
  height: 60px !important;
  border: 1px solid rgba(255,255,255,0.06);
  transition: border-color 0.2s;
}
.bg-swatch.active canvas { border-color: rgba(4,200,10,0.7); }
.bg-swatch span {
  font-size: 8px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.3);
}
.bg-swatch.active span { color: rgba(4,200,10,0.8); }

button {
  background: transparent;
  border: 1px solid rgba(4,200,10,0.4);
  color: rgba(4,200,10,0.9);
  font-family: 'Josefin Sans', sans-serif;
  font-weight: 200;
  font-size: 10px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  padding: 11px 8px;
  cursor: pointer;
  width: 100%;
  transition: all 0.18s;
}
button:hover { background: rgba(4,200,10,0.08); border-color: rgba(4,200,10,0.7); }
button.save { background: rgba(4,200,10,0.12); }

.previews {
  display: flex;
  flex-direction: column;
  gap: 24px;
  align-items: flex-start;
}

.slide-wrap { display: flex; flex-direction: column; gap: 8px; }

.slide-label {
  font-size: 9px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.2);
}

/* 1080×1080 at 40% = 432×432 */
canvas.preview {
  display: block;
  width: 432px;
  height: 432px;
  border: 1px solid rgba(255,255,255,0.04);
}
</style>
</head>
<body>

<div class="controls">
  <h1>KonXion · DJ Spotlight</h1>

  <div class="section-label">Slide 1</div>

  <div class="field">
    <label class="field-label">DJ Photo</label>
    <label class="photo-drop" id="dropZone">
      <input type="file" id="photoInput" accept="image/*">
      <span id="dropTxt">↑ click or drop photo</span>
    </label>
  </div>

  <div class="field">
    <label class="field-label">Photo crop — % from top</label>
    <input type="text" id="cropY" value="30">
  </div>

  <div class="section-label" style="margin-top:4px;">Both slides</div>

  <div class="field">
    <label class="field-label">DJ Name</label>
    <input type="text" id="djName" value="DJ NAME">
  </div>

  <div class="field">
    <label class="field-label">Instagram handle</label>
    <input type="text" id="handle" value="@djhandle">
  </div>

  <div class="field">
    <label class="field-label">Genres</label>
    <input type="text" id="genres" value="Minimal · Afro House · Tech House">
  </div>

  <div class="section-label" style="margin-top:4px;">Slide 2</div>

  <div class="field">
    <label class="field-label">Bio</label>
    <textarea id="bio">DJ Name es un artista cuyo sonido navega entre el Afro House y el House Orgánico — paisajes sónicos densos construidos con precisión e intención.

Una de las voces más consistentes de la escena underground colombiana.</textarea>
  </div>

  <div class="field">
    <label class="field-label">Background style</label>
    <div class="bg-options" id="bgOptions">
      <div class="bg-swatch" data-bg="fol">
        <canvas id="sw-fol" width="336" height="180"></canvas>
        <span>Flower of Life</span>
      </div>
      <div class="bg-swatch" data-bg="grid">
        <canvas id="sw-grid" width="336" height="180"></canvas>
        <span>Grid</span>
      </div>
      <div class="bg-swatch" data-bg="radial">
        <canvas id="sw-radial" width="336" height="180"></canvas>
        <span>Radial</span>
      </div>
      <div class="bg-swatch" data-bg="rings">
        <canvas id="sw-rings" width="336" height="180"></canvas>
        <span>Rings</span>
      </div>
      <div class="bg-swatch" data-bg="jungle">
        <canvas id="sw-jungle" width="336" height="180"></canvas>
        <span>Jungle</span>
      </div>
      <div class="bg-swatch" data-bg="neonbokeh">
        <canvas id="sw-neonbokeh" width="336" height="180"></canvas>
        <span>Neon Bokeh</span>
      </div>
      <div class="bg-swatch active" data-bg="waves">
        <canvas id="sw-waves" width="336" height="180"></canvas>
        <span>Sound Waves</span>
      </div>
      <div class="bg-swatch" data-bg="persian">
        <canvas id="sw-persian" width="336" height="180"></canvas>
        <span>Persian Rug</span>
      </div>
    </div>
  </div>

  <button onclick="render()">↺  Refresh Preview</button>
  <button class="save" onclick="saveCanvas('s1','konxion-dj-slide1.png')">↓  Save Slide 1 PNG</button>
  <button class="save" onclick="saveCanvas('s2','konxion-dj-slide2.png')">↓  Save Slide 2 PNG</button>
</div>

<div class="previews">
  <div class="slide-wrap">
    <div class="slide-label">Slide 1 — DJ Photo</div>
    <canvas id="s1" class="preview" width="1080" height="1080"></canvas>
  </div>
  <div class="slide-wrap">
    <div class="slide-label">Slide 2 — Bio</div>
    <canvas id="s2" class="preview" width="1080" height="1080"></canvas>
  </div>
</div>

<script>
const G  = 'rgb(4,200,10)';
const GA = a => `rgba(4,200,10,${a})`;
let photo   = null;
let bgStyle = 'waves';

// ─── Photo upload ──────────────────────────────────────────────
const dropZone   = document.getElementById('dropZone');
const photoInput = document.getElementById('photoInput');

photoInput.addEventListener('change', e => loadPhoto(e.target.files[0]));
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('over');
  loadPhoto(e.dataTransfer.files[0]);
});

function loadPhoto(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => { photo = img; document.getElementById('dropTxt').textContent = '✓ ' + file.name.slice(0,26); render(); };
  img.src = url;
}

// ─── Background style picker ───────────────────────────────────
document.getElementById('bgOptions').addEventListener('click', e => {
  const swatch = e.target.closest('.bg-swatch');
  if (!swatch) return;
  document.querySelectorAll('.bg-swatch').forEach(s => s.classList.remove('active'));
  swatch.classList.add('active');
  bgStyle = swatch.dataset.bg;
  render();
});

// Live update
document.querySelectorAll('input[type="text"], textarea').forEach(el =>
  el.addEventListener('input', render)
);

// ─── Background patterns ───────────────────────────────────────
function drawFOL(ctx, W, H, r, opacity) {
  const rowH = r * Math.sqrt(3) / 2;
  ctx.save();
  ctx.globalAlpha = opacity;
  ctx.strokeStyle = G;
  ctx.lineWidth   = 1.2;
  for (let row = -1; row * rowH < H + r; row++) {
    const offX = (row & 1) ? r / 2 : 0;
    for (let col = -1; col * r < W + r; col++) {
      ctx.beginPath(); ctx.arc(col * r + offX, row * rowH, r, 0, Math.PI * 2); ctx.stroke();
    }
  }
  ctx.restore();
}

function drawGrid(ctx, W, H, spacing, opacity) {
  ctx.save();
  ctx.globalAlpha = opacity;
  ctx.strokeStyle = G;
  ctx.lineWidth   = 0.7;
  for (let x = 0; x <= W; x += spacing) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y <= H; y += spacing) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.restore();
}

function drawRadial(ctx, W, H, numLines, opacity) {
  const cx = W / 2, cy = H / 2;
  const maxR = Math.sqrt(W * W + H * H);
  ctx.save();
  ctx.globalAlpha = opacity;
  ctx.strokeStyle = G;
  ctx.lineWidth   = 0.7;
  for (let i = 0; i < numLines; i++) {
    const a = (i / numLines) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + maxR * Math.cos(a), cy + maxR * Math.sin(a));
    ctx.stroke();
  }
  ctx.restore();
}

function drawRings(ctx, W, H, spacing, opacity) {
  const cx = W / 2, cy = H / 2;
  ctx.save();
  ctx.globalAlpha = opacity;
  ctx.strokeStyle = G;
  ctx.lineWidth   = 0.8;
  for (let r = spacing; r < Math.max(W, H) * 0.9; r += spacing) {
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
}

function drawNeonBokeh(ctx, W, H) {
  // Dark green base — noticeably lit, not black
  ctx.fillStyle = '#0f1c10';
  ctx.fillRect(0, 0, W, H);

  // Large color wash zones (corner blobs)
  [
    [W*0.0,  H*0.0,  W*0.75, 'rgba(4,180,20,0.22)'],
    [W*1.0,  H*0.0,  W*0.65, 'rgba(4,200,10,0.18)'],
    [W*0.0,  H*1.0,  W*0.70, 'rgba(4,150,25,0.20)'],
    [W*1.0,  H*1.0,  W*0.68, 'rgba(4,200,10,0.16)'],
    [W*0.5,  H*0.5,  W*0.60, 'rgba(0,80,15,0.30)'],
  ].forEach(([bx, by, br, color]) => {
    const c = color.match(/[\d.]+/g);
    const gr = ctx.createRadialGradient(bx, by, 0, bx, by, br);
    gr.addColorStop(0,   color);
    gr.addColorStop(0.55,`rgba(${c[0]},${c[1]},${c[2]},${(+c[3]*0.3).toFixed(3)})`);
    gr.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  });

  // Large bokeh circles with glowing rings
  [
    [0.10, 0.12, 90, 0.14], [0.88, 0.08, 72, 0.12],
    [0.22, 0.85, 82, 0.13], [0.80, 0.82, 76, 0.11],
    [0.55, 0.30, 60, 0.10], [0.38, 0.62, 65, 0.11],
    [0.72, 0.50, 58, 0.09], [0.15, 0.48, 54, 0.10],
    [0.60, 0.78, 62, 0.10], [0.42, 0.18, 50, 0.09],
  ].forEach(([rx, ry, r, a]) => {
    const bx = rx*W, by = ry*H;
    // Soft inner glow
    const gr = ctx.createRadialGradient(bx, by, 0, bx, by, r*2.2);
    gr.addColorStop(0,   `rgba(4,200,10,${(a*1.4).toFixed(3)})`);
    gr.addColorStop(0.45,`rgba(4,200,10,${(a*0.55).toFixed(3)})`);
    gr.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(bx, by, r*2.2, 0, Math.PI*2); ctx.fill();
    // Crisp ring outline
    ctx.save();
    ctx.strokeStyle = `rgba(4,200,10,${(a*0.7).toFixed(3)})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  });

  // Medium bokeh
  [
    [0.30, 0.22, 32, 0.11], [0.68, 0.18, 28, 0.09],
    [0.12, 0.70, 35, 0.10], [0.85, 0.40, 30, 0.09],
    [0.50, 0.55, 38, 0.10], [0.25, 0.38, 26, 0.08],
    [0.75, 0.65, 33, 0.09], [0.48, 0.90, 29, 0.10],
  ].forEach(([rx, ry, r, a]) => {
    const bx = rx*W, by = ry*H;
    const gr = ctx.createRadialGradient(bx, by, 0, bx, by, r*2);
    gr.addColorStop(0,   `rgba(4,200,10,${(a*1.2).toFixed(3)})`);
    gr.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(bx, by, r*2, 0, Math.PI*2); ctx.fill();
    ctx.save();
    ctx.strokeStyle = `rgba(120,255,140,${(a*0.5).toFixed(3)})`;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  });

  // Bright sparks
  ctx.save();
  for (let i = 0; i < 55; i++) {
    const px = (Math.sin(i*7.31+1.1)*0.5+0.5)*W;
    const py = (Math.sin(i*3.17+2.3)*0.5+0.5)*H;
    const pr = Math.abs(Math.sin(i*5.73+0.7))*2.8+0.4;
    const pa = Math.abs(Math.sin(i*2.91+3.2))*0.45+0.18;
    // Glow halo
    const sg = ctx.createRadialGradient(px, py, 0, px, py, pr*6);
    sg.addColorStop(0,   `rgba(4,200,10,${(pa*0.6).toFixed(3)})`);
    sg.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(px, py, pr*6, 0, Math.PI*2); ctx.fill();
    // Core dot
    ctx.fillStyle = `rgba(200,255,210,${Math.min(pa*1.6,0.9).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();

  // Soft vignette — not crushing
  const vig = ctx.createRadialGradient(W*0.5, H*0.5, W*0.12, W*0.5, H*0.5, W*0.85);
  vig.addColorStop(0,   'rgba(0,0,0,0)');
  vig.addColorStop(0.6, 'rgba(0,0,0,0.12)');
  vig.addColorStop(1,   'rgba(0,0,0,0.50)');
  ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);
}

function drawJungle(ctx, W, H) {
  // Forest green base — lighter, more visible
  const base = ctx.createLinearGradient(0, 0, 0, H);
  base.addColorStop(0,   '#1a2e1c');
  base.addColorStop(0.5, '#152618');
  base.addColorStop(1,   '#111f13');
  ctx.fillStyle = base; ctx.fillRect(0, 0, W, H);

  // Top canopy glow
  const topGlow = ctx.createRadialGradient(W*0.5, 0, 0, W*0.5, 0, W*0.85);
  topGlow.addColorStop(0,   'rgba(4,200,10,0.20)');
  topGlow.addColorStop(0.5, 'rgba(4,200,10,0.07)');
  topGlow.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = topGlow; ctx.fillRect(0, 0, W, H);

  // Canopy light shafts — more visible
  ctx.save();
  [0.15, 0.32, 0.50, 0.68, 0.85].forEach(relX => {
    const rx = W * relX, spread = W * 0.05;
    const rg = ctx.createLinearGradient(rx, 0, rx, H * 0.72);
    rg.addColorStop(0,   'rgba(180,255,185,0.10)');
    rg.addColorStop(0.4, 'rgba(4,200,10,0.04)');
    rg.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.moveTo(rx - spread*0.4, 0); ctx.lineTo(rx + spread*0.4, 0);
    ctx.lineTo(rx + spread*3,   H * 0.72); ctx.lineTo(rx - spread*3, H * 0.72);
    ctx.closePath(); ctx.fill();
  });
  ctx.restore();

  // Leaf — filled + brand green outline for visibility
  function drawLeaf(lx, ly, len, angle, wRatio, fillOpacity, fillColor, strokeOpacity) {
    ctx.save();
    ctx.translate(lx, ly); ctx.rotate(angle);
    const w = len * wRatio;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(-w*0.7, -len*0.25, -w*0.4, -len*0.8, 0, -len);
    ctx.bezierCurveTo( w*0.4, -len*0.8,  w*0.7, -len*0.25, 0, 0);
    ctx.globalAlpha = fillOpacity;
    ctx.fillStyle   = fillColor;
    ctx.fill();
    ctx.globalAlpha = strokeOpacity;
    ctx.strokeStyle = G;
    ctx.lineWidth   = Math.max(0.8, len * 0.009);
    ctx.stroke();
    ctx.globalAlpha = strokeOpacity * 0.55;
    ctx.lineWidth   = Math.max(0.5, len * 0.013);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -len); ctx.stroke();
    ctx.restore();
  }

  function drawFrondLeaf(lx, ly, len, angle, opacity) {
    ctx.save();
    ctx.globalAlpha = opacity;
    ctx.translate(lx, ly); ctx.rotate(angle);
    const w = len * 0.055;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(-w, -len*0.3, -w*0.5, -len*0.85, 0, -len);
    ctx.bezierCurveTo( w*0.5, -len*0.85, w, -len*0.3, 0, 0);
    ctx.fillStyle   = 'rgba(3,55,12,0.85)';
    ctx.strokeStyle = G;
    ctx.lineWidth   = Math.max(0.5, len * 0.007);
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  const PI = Math.PI;

  // Background leaves — dark fills, subtle green outline
  [
    [W*0.0,  H*0.0,  W*0.65, PI*0.15, 0.28, 0.28, 'rgba(2,30,7,0.9)',  0.06],
    [W*1.0,  H*0.02, W*0.60, PI*0.85, 0.30, 0.26, 'rgba(2,28,6,0.85)', 0.05],
    [W*0.08, H*0.38, W*0.55, PI*0.22, 0.25, 0.22, 'rgba(2,26,6,0.8)',  0.05],
    [W*0.92, H*0.42, W*0.52, PI*0.78, 0.25, 0.20, 'rgba(2,26,6,0.8)',  0.04],
    [W*0.12, H*0.82, W*0.60, PI*0.08, 0.30, 0.28, 'rgba(2,24,5,0.85)', 0.06],
    [W*0.88, H*0.85, W*0.55, PI*0.92, 0.28, 0.26, 'rgba(2,26,6,0.82)', 0.05],
    [W*0.50, H*0.98, W*0.65, PI*0.50, 0.32, 0.30, 'rgba(1,20,4,0.88)', 0.07],
    [W*0.30, H*0.96, W*0.55, PI*0.30, 0.28, 0.24, 'rgba(2,22,5,0.82)', 0.06],
    [W*0.70, H*0.94, W*0.50, PI*0.70, 0.28, 0.22, 'rgba(2,22,5,0.80)', 0.05],
  ].forEach(([x,y,l,a,wr,fo,fc,so]) => drawLeaf(x,y,l,a,wr,fo,fc,so));

  // Midground — medium green, more visible
  [
    [W*-0.02, H*0.02, W*0.44, PI*0.18, 0.32, 0.40, 'rgba(3,55,12,0.85)', 0.09],
    [W*1.02,  H*0.05, W*0.40, PI*0.82, 0.30, 0.38, 'rgba(3,50,11,0.82)', 0.08],
    [W*0.0,   H*0.44, W*0.42, PI*0.14, 0.28, 0.35, 'rgba(3,58,13,0.80)', 0.08],
    [W*1.0,   H*0.52, W*0.40, PI*0.86, 0.28, 0.32, 'rgba(3,52,11,0.78)', 0.07],
    [W*0.02,  H*0.78, W*0.46, PI*0.12, 0.30, 0.42, 'rgba(3,60,14,0.88)', 0.09],
    [W*0.98,  H*0.80, W*0.44, PI*0.88, 0.30, 0.40, 'rgba(3,55,12,0.85)', 0.08],
    [W*0.18,  H*0.99, W*0.42, PI*0.32, 0.28, 0.44, 'rgba(2,45,10,0.90)', 0.10],
    [W*0.82,  H*0.97, W*0.40, PI*0.68, 0.28, 0.42, 'rgba(2,45,10,0.88)', 0.09],
  ].forEach(([x,y,l,a,wr,fo,fc,so]) => drawLeaf(x,y,l,a,wr,fo,fc,so));

  // Foreground accent — most visible, brighter green
  [
    [W*-0.04, H*0.0,  W*0.38, PI*0.28, 0.30, 0.52, 'rgba(4,72,16,0.85)', 0.13],
    [W*1.04,  H*0.0,  W*0.35, PI*0.72, 0.28, 0.50, 'rgba(4,68,15,0.82)', 0.12],
    [W*0.0,   H*0.85, W*0.36, PI*0.20, 0.30, 0.54, 'rgba(4,75,16,0.88)', 0.13],
    [W*1.0,   H*0.87, W*0.34, PI*0.80, 0.28, 0.52, 'rgba(4,70,15,0.85)', 0.12],
  ].forEach(([x,y,l,a,wr,fo,fc,so]) => drawLeaf(x,y,l,a,wr,fo,fc,so));

  // Palm frond fans
  [
    { cx: W*0.0,  cy: H*0.0,  len: W*0.55, base: PI*0.30, n: 7 },
    { cx: W*1.0,  cy: H*0.01, len: W*0.50, base: PI*0.70, n: 7 },
    { cx: W*0.05, cy: H*0.98, len: W*0.50, base:-PI*0.05, n: 6 },
    { cx: W*0.95, cy: H*0.96, len: W*0.48, base: PI*1.05, n: 6 },
  ].forEach(({ cx, cy, len, base, n }) => {
    for (let i = 0; i < n; i++) {
      const t = (i / (n-1)) - 0.5;
      drawFrondLeaf(cx, cy, len*(1-Math.abs(t)*0.3), base+t*PI*0.5, 0.36*(1-Math.abs(t)*0.35));
    }
  });

  // Bokeh orbs — varied sizes, more playful than tiny dots
  ctx.save();
  const bokeh = [
    [0.15, 0.12, 30, 0.18], [0.82, 0.08, 20, 0.15], [0.45, 0.22, 13, 0.13],
    [0.68, 0.35, 24, 0.17], [0.25, 0.55, 16, 0.14], [0.88, 0.48, 22, 0.16],
    [0.10, 0.70, 26, 0.18], [0.72, 0.65, 15, 0.13], [0.38, 0.80, 19, 0.15],
    [0.90, 0.78, 23, 0.17], [0.55, 0.90, 17, 0.14], [0.20, 0.92, 21, 0.16],
    [0.78, 0.92, 25, 0.18], [0.42, 0.45, 11, 0.11], [0.62, 0.18, 15, 0.12],
    [0.33, 0.30, 18, 0.14], [0.57, 0.60, 12, 0.12], [0.05, 0.50, 14, 0.13],
  ];
  // Add smaller sparks
  for (let i = 0; i < 32; i++) {
    bokeh.push([
      Math.sin(i*7.31+1.1)*0.5+0.5,
      Math.sin(i*3.17+2.3)*0.5+0.5,
      Math.abs(Math.sin(i*5.73+0.7))*4+1.5,
      Math.sin(i*2.91+3.2)*0.5*0.18+0.07
    ]);
  }
  bokeh.forEach(([rx, ry, r, a]) => {
    const bx = rx*W, by = ry*H;
    const gr = ctx.createRadialGradient(bx, by, 0, bx, by, r*4);
    gr.addColorStop(0,   `rgba(4,200,10,${(a*1.3).toFixed(3)})`);
    gr.addColorStop(0.4, `rgba(4,200,10,${(a*0.5).toFixed(3)})`);
    gr.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(bx, by, r*4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = `rgba(190,255,195,${Math.min(a*1.6, 0.9)})`;
    ctx.beginPath(); ctx.arc(bx, by, r*0.38, 0, Math.PI*2); ctx.fill();
  });
  ctx.restore();

  // Strong emerald center glow
  const glow = ctx.createRadialGradient(W*0.5, H*0.42, 0, W*0.5, H*0.42, W*0.82);
  glow.addColorStop(0,   'rgba(4,200,10,0.12)');
  glow.addColorStop(0.45,'rgba(4,200,10,0.04)');
  glow.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

  // Soft vignette — keeps edges dark but not black
  const vig = ctx.createRadialGradient(W*0.5, H*0.48, W*0.15, W*0.5, H*0.48, W*0.88);
  vig.addColorStop(0,    'rgba(0,0,0,0)');
  vig.addColorStop(0.65, 'rgba(0,0,0,0.10)');
  vig.addColorStop(1,    'rgba(0,0,0,0.42)');
  ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);
}

function drawWaves(ctx, W, H) {
  // Dark green-tinted base — noticeably lit
  ctx.fillStyle = '#0b1a0d'; ctx.fillRect(0, 0, W, H);

  // Warm center glow
  const cg = ctx.createRadialGradient(W*0.5, H*0.52, 0, W*0.5, H*0.52, W*0.65);
  cg.addColorStop(0,   GA(0.18));
  cg.addColorStop(0.5, GA(0.07));
  cg.addColorStop(1,   GA(0));
  ctx.fillStyle = cg; ctx.fillRect(0, 0, W, H);

  // Dense sine waves — brighter opacity
  const lines = 30;
  for (let i = 0; i < lines; i++) {
    const baseY = (H / (lines - 1)) * i;
    const amp   = 7 + Math.abs(Math.sin(i * 0.7)) * 26;
    const freq  = 0.011 + Math.abs(Math.sin(i * 1.3)) * 0.009;
    const phase = i * 0.9;
    const distFromMid = Math.abs(i - lines / 2) / (lines / 2);
    const opacity = 0.07 + 0.17 * (1 - distFromMid * 0.45);
    ctx.beginPath();
    for (let x = 0; x <= W; x += 2) {
      const y = baseY
        + Math.sin(x * freq + phase) * amp
        + Math.sin(x * freq * 1.7 + phase * 0.5) * amp * 0.35;
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = GA(opacity);
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }

  // 3 bright accent waves cutting across center
  ctx.save();
  [{ relY:0.28, amp:24, freq:0.0065, ph:0.0 },
   { relY:0.50, amp:32, freq:0.0050, ph:1.2 },
   { relY:0.72, amp:22, freq:0.0070, ph:2.5 }].forEach(({ relY, amp, freq, ph }) => {
    ctx.beginPath();
    for (let x = 0; x <= W; x += 2) {
      const y = H * relY + Math.sin(x * freq + ph) * amp;
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = GA(0.26);
    ctx.lineWidth = 1.8;
    ctx.stroke();
  });
  ctx.restore();

  // Soft vignette — lighter than before
  const vig = ctx.createRadialGradient(W/2, H/2, W*0.25, W/2, H/2, W*0.78);
  vig.addColorStop(0,   'rgba(0,0,0,0)');
  vig.addColorStop(0.7, 'rgba(0,0,0,0.10)');
  vig.addColorStop(1,   'rgba(0,0,0,0.42)');
  ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);
}

function drawPersianRug(ctx, W, H) {
  const S = Math.min(W, H);
  const clamp = v => Math.max(0.5, v);

  // ── Base ──
  ctx.fillStyle = '#0f1c11'; ctx.fillRect(0, 0, W, H);
  const bg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, S*0.62);
  bg.addColorStop(0, 'rgba(4,200,10,0.13)'); bg.addColorStop(1, GA(0));
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // ── Local helpers ──
  function border(inset, op, lw) {
    ctx.save(); ctx.strokeStyle = GA(op); ctx.lineWidth = clamp(lw);
    ctx.strokeRect(inset, inset, W - inset*2, H - inset*2); ctx.restore();
  }
  function diamond(cx, cy, s, op) {
    ctx.save(); ctx.strokeStyle = GA(op); ctx.lineWidth = clamp(s*0.08);
    ctx.translate(cx, cy); ctx.rotate(Math.PI/4);
    ctx.strokeRect(-s/2, -s/2, s, s); ctx.restore();
  }
  function rosette(cx, cy, r, n, op) {
    ctx.save(); ctx.strokeStyle = GA(op); ctx.lineWidth = clamp(r*0.07);
    for (let i = 0; i < n; i++) {
      const a = (i/n)*Math.PI*2;
      ctx.beginPath();
      ctx.ellipse(cx+Math.cos(a)*r*0.55, cy+Math.sin(a)*r*0.55, r*0.30, r*0.16, a, 0, Math.PI*2);
      ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(cx, cy, r*0.20, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  function boteh(cx, cy, sz, op) {
    ctx.save(); ctx.strokeStyle = GA(op); ctx.lineWidth = clamp(sz*0.055);
    ctx.translate(cx, cy);
    ctx.beginPath();
    ctx.moveTo(0, sz*.52); ctx.bezierCurveTo(sz*.52, sz*.18, sz*.42, -sz*.28, 0, -sz*.52);
    ctx.bezierCurveTo(-sz*.42, -sz*.28, -sz*.52, sz*.18, 0, sz*.52);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, sz*.28); ctx.bezierCurveTo(sz*.22, sz*.05, sz*.18, -sz*.22, 0, -sz*.33);
    ctx.bezierCurveTo(-sz*.18, -sz*.22, -sz*.22, sz*.05, 0, sz*.28);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, -sz*.52); ctx.bezierCurveTo(sz*.28, -sz*.65, sz*.40, -sz*.38, sz*.12, -sz*.28);
    ctx.stroke();
    ctx.restore();
  }
  function medallion(cx, cy, r, op) {
    ctx.save(); ctx.translate(cx, cy);
    const lw = v => clamp(r*v);
    ctx.strokeStyle = GA(op*.80); ctx.lineWidth = lw(0.012);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.stroke();
    for (let i = 0; i < 16; i++) {
      ctx.save(); ctx.rotate((i/16)*Math.PI*2);
      ctx.strokeStyle = GA(op*.58); ctx.lineWidth = lw(0.009);
      ctx.beginPath(); ctx.ellipse(r*.78, 0, r*.17, r*.08, 0, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    }
    ctx.strokeStyle = GA(op*.74); ctx.lineWidth = lw(0.014);
    ctx.beginPath(); ctx.arc(0, 0, r*.68, 0, Math.PI*2); ctx.stroke();
    for (let rot = 0; rot < 2; rot++) {
      ctx.save(); ctx.rotate(rot*Math.PI/4);
      ctx.strokeStyle = GA(op*.68); ctx.lineWidth = lw(0.014);
      ctx.beginPath();
      for (let i = 0; i < 4; i++) {
        const a = (i/4)*Math.PI*2;
        i ? ctx.lineTo(Math.cos(a)*r*.58, Math.sin(a)*r*.58)
          : ctx.moveTo(Math.cos(a)*r*.58, Math.sin(a)*r*.58);
      }
      ctx.closePath(); ctx.stroke(); ctx.restore();
    }
    for (let i = 0; i < 8; i++) {
      ctx.save(); ctx.rotate((i/8)*Math.PI*2);
      ctx.strokeStyle = GA(op*.62); ctx.lineWidth = lw(0.010);
      ctx.beginPath(); ctx.ellipse(r*.42, 0, r*.24, r*.12, 0, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    }
    ctx.strokeStyle = GA(op*.74); ctx.lineWidth = lw(0.012);
    ctx.beginPath(); ctx.arc(0, 0, r*.30, 0, Math.PI*2); ctx.stroke();
    for (let rot = 0; rot < 2; rot++) {
      ctx.save(); ctx.rotate(rot*Math.PI/4);
      ctx.strokeStyle = GA(op*.62); ctx.lineWidth = lw(0.010);
      ctx.beginPath();
      for (let i = 0; i < 4; i++) {
        const a = (i/4)*Math.PI*2;
        i ? ctx.lineTo(Math.cos(a)*r*.22, Math.sin(a)*r*.22)
          : ctx.moveTo(Math.cos(a)*r*.22, Math.sin(a)*r*.22);
      }
      ctx.closePath(); ctx.stroke(); ctx.restore();
    }
    ctx.fillStyle = GA(op*.82);
    ctx.beginPath(); ctx.arc(0, 0, r*.10, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // ── Border bands ──
  const b = [S*.016,S*.020,S*.026,S*.052,S*.058,S*.062,S*.082,S*.088];
  border(b[0], 0.72, S*.0022); border(b[1], 0.28, S*.0007);

  // Diamond chain in band b[2]→b[3]
  const dcSp = S*.028, dcSz = S*.020;
  for (let side = 0; side < 4; side++) {
    const isH = side%2 === 0;
    const len = (isH ? W : H) - b[2]*2;
    const n = Math.floor(len / dcSp);
    const start = b[2] + (len - (n-1)*dcSp)/2;
    const mid = b[2] + dcSz*0.5;
    for (let i = 0; i < n; i++) {
      const pos = start + i*dcSp;
      const cx = side===0?pos:side===1?W-mid:side===2?W-pos:mid;
      const cy = side===0?mid:side===1?pos:side===2?H-mid:H-pos;
      diamond(cx, cy, dcSz, 0.52);
    }
  }

  border(b[3], 0.65, S*.0018); border(b[4], 0.26, S*.0006);

  // Rosette band in b[5]→b[6]
  const rbSp = S*.028, rbR = (b[6]-b[5])*.42, rbMid = b[5]+(b[6]-b[5])*.5;
  for (let side = 0; side < 4; side++) {
    const isH = side%2 === 0;
    const len = (isH ? W : H) - b[5]*2;
    const n = Math.floor(len / rbSp);
    const start = b[5] + (len - (n-1)*rbSp)/2;
    for (let i = 0; i < n; i++) {
      const pos = start + i*rbSp;
      const cx = side===0?pos:side===1?W-rbMid:side===2?W-pos:rbMid;
      const cy = side===0?rbMid:side===1?pos:side===2?H-rbMid:H-pos;
      rosette(cx, cy, rbR, 6, 0.42);
    }
  }
  border(b[6], 0.60, S*.0016);

  // ── Field ──
  const fi = b[7];
  ctx.save();
  ctx.beginPath(); ctx.rect(fi, fi, W-fi*2, H-fi*2); ctx.clip();

  const tCell = S*0.092, tStep = tCell/Math.SQRT2;
  ctx.strokeStyle = GA(0.17); ctx.lineWidth = clamp(S*0.0008);
  for (let t = -W; t < W+H; t += tCell) {
    ctx.beginPath(); ctx.moveTo(t,-H); ctx.lineTo(t+H*2,H*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(t,-H); ctx.lineTo(t-H*2,H*2); ctx.stroke();
  }

  const range = Math.ceil(Math.max(W,H)*0.55 / tStep) + 1;
  for (let p = -range; p <= range; p++) {
    for (let q = -range; q <= range; q++) {
      const ix = W/2 + p*tStep, iy = H/2 + q*tStep;
      if (ix < fi+2 || ix > W-fi-2 || iy < fi+2 || iy > H-fi-2) continue;
      if ((p+q)%2 === 0) rosette(ix, iy, tCell*0.13, 8, 0.36);
      else boteh(ix, iy, tCell*0.22, 0.26);
    }
  }
  ctx.restore();

  // ── Center medallion ──
  medallion(W/2, H/2, S*0.185, 0.72);

  // ── Corner ornaments ──
  const co = fi + S*0.055;
  [[co,co],[W-co,co],[co,H-co],[W-co,H-co]].forEach(([cx,cy]) => medallion(cx, cy, S*0.055, 0.52));
}

function applyBg(ctx, W, H, style) {
  // Common overlays
  const vignette = ctx.createRadialGradient(W/2, H/2, W*0.22, W/2, H/2, W*0.82);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.68)');

  const bottomGlow = ctx.createRadialGradient(W/2, H, 0, W/2, H * 0.68, W * 0.9);
  bottomGlow.addColorStop(0, GA(0.20));
  bottomGlow.addColorStop(1, GA(0));

  if (style === 'fol')    drawFOL(ctx, W, H, 88, 0.055);
  if (style === 'grid')   drawGrid(ctx, W, H, 90, 0.06);
  if (style === 'radial') drawRadial(ctx, W, H, 72, 0.055);
  if (style === 'rings')  drawRings(ctx, W, H, 110, 0.07);
  if (style === 'jungle')    drawJungle(ctx, W, H);
  if (style === 'neonbokeh') drawNeonBokeh(ctx, W, H);
  if (style === 'waves')      drawWaves(ctx, W, H);
  if (style === 'persian')   drawPersianRug(ctx, W, H);

  ctx.fillStyle = bottomGlow; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = vignette;   ctx.fillRect(0, 0, W, H);
}

// ─── Corner brackets ───────────────────────────────────────────
function drawBrackets(ctx, x, y, w, h, pad, len, lw, color) {
  ctx.save();
  ctx.strokeStyle = color || G;
  ctx.lineWidth   = lw || 2.5;
  ctx.lineCap     = 'square';
  const p = -pad; // negative = outside the rect
  [
    [[x+p, y+p+len], [x+p, y+p], [x+p+len, y+p]],
    [[x+w-p-len, y+p], [x+w-p, y+p], [x+w-p, y+p+len]],
    [[x+p, y+h-p-len], [x+p, y+h-p], [x+p+len, y+h-p]],
    [[x+w-p-len, y+h-p], [x+w-p, y+h-p], [x+w-p, y+h-p-len]]
  ].forEach(pts => {
    ctx.beginPath();
    ctx.moveTo(...pts[0]); ctx.lineTo(...pts[1]); ctx.lineTo(...pts[2]);
    ctx.stroke();
  });
  ctx.restore();
}

// ─── Text wrap ─────────────────────────────────────────────────
function wrapLines(ctx, text, maxW) {
  const result = [];
  for (const para of text.split(/\n+/)) {
    if (!para.trim()) { result.push(''); continue; }
    let line = '';
    for (const w of para.split(' ')) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && line) { result.push(line); line = w; }
      else line = test;
    }
    if (line) result.push(line);
  }
  return result;
}

// ─── SLIDE 1: Framed photo ─────────────────────────────────────
function drawSlide1(canvas) {
  const ctx = canvas.getContext('2d');
  const W = 1080, H = 1080;
  const name   = (document.getElementById('djName').value || 'DJ NAME').toUpperCase();
  const handle = document.getElementById('handle').value  || '@djhandle';
  const cropY  = parseInt(document.getElementById('cropY').value || '30', 10);

  // Background canvas (waves matches slide 2)
  ctx.fillStyle = '#080808'; ctx.fillRect(0, 0, W, H);
  applyBg(ctx, W, H, bgStyle);

  // Photo frame — inset so the background shows as a border
  const fx = 56, fy = 76, fw = W - 112, fh = H - 220;

  if (photo) {
    ctx.save();
    ctx.beginPath(); ctx.rect(fx, fy, fw, fh); ctx.clip();
    const scale = Math.max(fw / photo.naturalWidth, fh / photo.naturalHeight);
    const sw = photo.naturalWidth * scale;
    const sh = photo.naturalHeight * scale;
    const sx = fx + (fw - sw) / 2;
    const maxSy = fy + fh - sh;
    const sy = Math.min(fy, Math.max(maxSy, fy - (sh - fh) * (cropY / 100)));
    ctx.drawImage(photo, sx, sy, sw, sh);
    // Fade bottom of photo so name text stays readable
    const fade = ctx.createLinearGradient(0, fy + fh * 0.55, 0, fy + fh);
    fade.addColorStop(0, 'rgba(0,0,0,0)');
    fade.addColorStop(1, 'rgba(0,0,0,0.82)');
    ctx.fillStyle = fade; ctx.fillRect(fx, fy + fh * 0.55, fw, fh * 0.45);
    ctx.restore();
  } else {
    ctx.fillStyle = '#111'; ctx.fillRect(fx, fy, fw, fh);
    ctx.fillStyle = GA(0.18);
    ctx.font = '200 22px "Josefin Sans", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('ADD DJ PHOTO', W/2, fy + fh / 2);
  }

  // Frame border + corner brackets
  ctx.save(); ctx.strokeStyle = GA(0.5); ctx.lineWidth = 1.5; ctx.strokeRect(fx, fy, fw, fh); ctx.restore();
  drawBrackets(ctx, fx, fy, fw, fh, 8, 72, 2.5, G);

  // ── "DJ SPOTLIGHT" above frame ──
  ctx.save();
  ctx.fillStyle     = GA(0.80);
  ctx.font          = '100 18px "Josefin Sans", sans-serif';
  ctx.textAlign     = 'center';
  ctx.letterSpacing = '0.42em';
  ctx.shadowColor   = 'rgba(0,0,0,0.9)';
  ctx.shadowBlur    = 10;
  ctx.fillText('DJ SPOTLIGHT', W/2, 50);
  ctx.restore();

  // ── DJ Name — overlaid on bottom-right of photo ──
  ctx.save();
  const namePx = name.length > 14 ? 66 : name.length > 10 ? 80 : 94;
  ctx.fillStyle     = '#ffffff';
  ctx.font          = `300 ${namePx}px "Cormorant Garamond", serif`;
  ctx.textAlign     = 'right';
  ctx.letterSpacing = '0.03em';
  ctx.shadowColor   = 'rgba(0,0,0,0.92)';
  ctx.shadowBlur    = 20;
  ctx.shadowOffsetX = 2;
  ctx.shadowOffsetY = 3;

  const nameParts = name.split(' ');
  const splitAt = Math.ceil(nameParts.length / 2);
  const nameY   = fy + fh - (nameParts.length >= 2 ? namePx * 1.05 + 28 : 28);

  if (nameParts.length >= 2) {
    ctx.fillText(nameParts.slice(0, splitAt).join(' '), fx + fw - 20, nameY);
    ctx.fillText(nameParts.slice(splitAt).join(' '),    fx + fw - 20, nameY + namePx * 1.0);
  } else {
    ctx.fillText(name, fx + fw - 20, nameY + namePx * 0.9);
  }
  ctx.restore();

  // ── Handle + konxion.us below frame ──
  ctx.save();
  ctx.font          = '200 20px "Josefin Sans", sans-serif';
  ctx.fillStyle     = 'rgba(255,255,255,0.82)';
  ctx.textAlign     = 'left';
  ctx.letterSpacing = '0.22em';
  ctx.shadowColor   = 'rgba(0,0,0,0.80)';
  ctx.shadowBlur    = 8;
  ctx.fillText(handle, fx, fy + fh + 60);
  ctx.restore();

  ctx.save();
  ctx.font          = '200 15px "Josefin Sans", sans-serif';
  ctx.letterSpacing = '0.28em';
  ctx.fillStyle     = GA(0.88);
  ctx.textAlign     = 'right';
  ctx.shadowColor   = 'rgba(0,0,0,0.80)';
  ctx.shadowBlur    = 8;
  ctx.fillText('konxion.us', fx + fw, fy + fh + 60);
  ctx.restore();
}

// ─── SLIDE 2: Bio ──────────────────────────────────────────────
function drawSlide2(canvas) {
  const ctx = canvas.getContext('2d');
  const W = 1080, H = 1080;
  const name   = (document.getElementById('djName').value || 'DJ NAME').toUpperCase();
  const handle = document.getElementById('handle').value  || '@djhandle';
  const bio    = document.getElementById('bio').value     || '';

  // Background
  ctx.fillStyle = '#080808'; ctx.fillRect(0, 0, W, H);
  applyBg(ctx, W, H, bgStyle);

  // Page corner brackets
  drawBrackets(ctx, 52, 52, W - 104, H - 104, 0, 110, 2.5, G);

  // ── "DJ SPOTLIGHT" ──
  ctx.save();
  ctx.fillStyle     = GA(0.78);
  ctx.font          = '100 20px "Josefin Sans", sans-serif';
  ctx.textAlign     = 'center';
  ctx.letterSpacing = '0.42em';
  ctx.fillText('DJ SPOTLIGHT', W/2, 84);
  ctx.strokeStyle = GA(0.28); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(100, 74); ctx.lineTo(310, 74); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W-310, 74); ctx.lineTo(W-100, 74); ctx.stroke();
  ctx.restore();

  // ── DJ Name ──
  ctx.save();
  const namePx = name.length > 14 ? 82 : name.length > 10 ? 98 : 116;
  ctx.fillStyle     = '#ffffff';
  ctx.textAlign     = 'center';
  ctx.letterSpacing = '0.05em';
  ctx.font          = `300 ${namePx}px "Cormorant Garamond", serif`;
  ctx.shadowColor   = 'rgba(0,0,0,0.85)';
  ctx.shadowBlur    = 20;
  ctx.shadowOffsetY = 3;
  ctx.fillText(name, W/2, 186);
  ctx.restore();

  // ── Green underline ──
  ctx.save();
  ctx.strokeStyle = G; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(160, 210); ctx.lineTo(W-160, 210); ctx.stroke();
  ctx.restore();

  // ── Bio text ──
  ctx.save();
  ctx.fillStyle     = '#ffffff';
  ctx.font          = '300 italic 34px "Cormorant Garamond", serif';
  ctx.textAlign     = 'center';
  ctx.letterSpacing = '0.02em';
  ctx.shadowColor   = 'rgba(0,0,0,0.90)';
  ctx.shadowBlur    = 14;
  ctx.shadowOffsetY = 2;
  const lines = wrapLines(ctx, bio, 860);
  let bioY = 268;
  for (const line of lines) {
    if (!line) { bioY += 16; continue; }
    ctx.fillText(line, W/2, bioY);
    bioY += 44;
  }
  ctx.restore();

  // ── Footer ──
  const footerY = Math.min(bioY + 100, H - 190);

  ctx.save();
  ctx.strokeStyle = GA(0.25); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(200, footerY); ctx.lineTo(W-200, footerY); ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.fillStyle     = 'rgba(255,255,255,0.55)';
  ctx.font          = '200 italic 28px "Cormorant Garamond", serif';
  ctx.textAlign     = 'center';
  ctx.letterSpacing = '0.08em';
  ctx.shadowColor   = 'rgba(0,0,0,0.80)';
  ctx.shadowBlur    = 10;
  ctx.fillText('Performing live · KonXion · Julio 18', W/2, footerY + 46);
  ctx.restore();

  ctx.save();
  ctx.fillStyle     = GA(0.95);
  ctx.font          = '200 24px "Josefin Sans", sans-serif';
  ctx.textAlign     = 'center';
  ctx.letterSpacing = '0.22em';
  ctx.shadowColor   = 'rgba(0,0,0,0.80)';
  ctx.shadowBlur    = 10;
  ctx.fillText(handle, W/2, footerY + 86);
  ctx.restore();

  // ── Bottom bar ──
  ctx.save();
  ctx.font = '200 16px "Josefin Sans", sans-serif';
  ctx.letterSpacing = '0.28em';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.textAlign = 'left';
  ctx.fillText('BETHEL LOZANA · GUATAPÉ', 72, H - 38);
  ctx.fillStyle = GA(0.85);
  ctx.textAlign = 'right';
  ctx.fillText('konxion.us', W - 72, H - 38);
  ctx.restore();
}

// ─── Swatch previews ───────────────────────────────────────────
function drawSwatches() {
  [
    ['sw-fol',    c => { c.fillStyle='#000'; c.fillRect(0,0,336,180); drawFOL(c,336,180,28,0.07); }],
    ['sw-grid',   c => { c.fillStyle='#000'; c.fillRect(0,0,336,180); drawGrid(c,336,180,30,0.09); }],
    ['sw-radial', c => { c.fillStyle='#000'; c.fillRect(0,0,336,180); drawRadial(c,336,180,48,0.08); }],
    ['sw-rings',  c => { c.fillStyle='#000'; c.fillRect(0,0,336,180); drawRings(c,336,180,36,0.1); }],
    ['sw-jungle',    c => { c.fillStyle='#000'; c.fillRect(0,0,336,180); drawJungle(c,336,180); }],
    ['sw-neonbokeh', c => { c.fillStyle='#0f1c10'; c.fillRect(0,0,336,180); drawNeonBokeh(c,336,180); }],
    ['sw-waves',    c => { c.fillStyle='#0b1a0d'; c.fillRect(0,0,336,180); drawWaves(c,336,180); }],
    ['sw-persian',  c => { c.fillStyle='#0f1c11'; c.fillRect(0,0,336,180); drawPersianRug(c,336,180); }],
  ].forEach(([id, fn]) => {
    const cv = document.getElementById(id);
    fn(cv.getContext('2d'));
  });
}

// ─── Render ────────────────────────────────────────────────────
function render() {
  drawSlide1(document.getElementById('s1'));
  drawSlide2(document.getElementById('s2'));
}

function saveCanvas(id, filename) {
  const a = document.createElement('a');
  a.download = filename;
  a.href = document.getElementById(id).toDataURL('image/png');
  a.click();
}

// Boot
document.fonts.ready.then(() => { drawSwatches(); render(); });
</script>
</body>
